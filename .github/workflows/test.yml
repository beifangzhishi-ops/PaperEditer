name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: thesis-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: thesis-workbench/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: python -m unittest test_server
      - name: Browser regression tests
        run: PAPEREDITER_CHROME_PATH="$(command -v google-chrome)" node test_ui.cjs
      - name: Clean document UI regression tests
        run: PAPEREDITER_CHROME_PATH="$(command -v google-chrome)" node test_ui.cjs --clean-body-only
      - name: Reading position switch regression tests
        run: PAPEREDITER_CHROME_PATH="$(command -v google-chrome)" node test_ui.cjs --reading-switch-only
